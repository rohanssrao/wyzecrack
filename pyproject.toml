[project]
name = "wyzecrack"
version = "0.1.0"
description = "Watch and record Wyze cameras from their local network"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "av>=12",
    "pillow>=10",
    "aiohttp>=3.9",
    "certifi>=2024.2",
]

[project.scripts]
wyzecrack = "wyzecrack.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
